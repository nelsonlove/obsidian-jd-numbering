name: Release

# Push a bare `X.Y.Z` tag (Obsidian convention — no `v` prefix) matching
# manifest.json to build the plugin and publish a GitHub Release with the built
# files attached. BRAT reads the root manifest.json for the version, then
# installs the assets from the Release tagged with that version.
#
# workflow_dispatch re-runs the publish for the current manifest version (e.g.
# if a Release needs regenerating).

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)publish (defaults to manifest.json)"
        required: false
        type: string

# The Release is created with this repo's own GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build
          test -f main.js

      # Resolve the version to publish and, for tag pushes, verify it matches
      # the manifest so a Release can never be mislabeled relative to its tag.
      - name: Resolve version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          MAN="$(node -p "require('./manifest.json').version")"
          if [ "$EVENT" = "push" ]; then
            if [ "$TAG" != "$MAN" ]; then
              echo "::error::Tag '$TAG' != manifest.json version '$MAN'. Bump the manifest or fix the tag."
              exit 1
            fi
            VERSION="$TAG"
          else
            VERSION="${INPUT:-$MAN}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          ASSETS="main.js manifest.json"
          [ -f styles.css ] && ASSETS="$ASSETS styles.css"
          [ -f versions.json ] && ASSETS="$ASSETS versions.json"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" $ASSETS --clobber
          else
            gh release create "$VERSION" $ASSETS \
              --title "$VERSION" \
              --notes "Automated release for JD Numbering $VERSION."
          fi
